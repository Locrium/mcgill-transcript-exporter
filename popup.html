<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>McGill Video Transcript Exporter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true"><img src="assets/mcgill-transcript-logo.png" alt="" /></div>
        <div>
          <h1>McGill Video Transcript Exporter</h1>
          <p id="status" role="status">Looking for captions…</p>
        </div>
      </header>

      <section id="results" aria-live="polite"></section>

      <section id="settings" class="settings" hidden>
        <label for="format">Export format</label>
        <select id="format">
          <option value="md">Markdown (.md)</option>
          <option value="txt">Plain text (.txt)</option>
          <option value="vtt">WebVTT captions (.vtt)</option>
        </select>
        <label class="check">
          <input id="timestamps" type="checkbox" />
          Include timestamps
        </label>
        <label class="check batch-setting">
          <input id="batchEnabled" type="checkbox" />
          Enable batch export
          <span>Select recordings manually before exporting a ZIP.</span>
        </label>
      </section>

      <button id="batch" class="secondary" type="button" hidden>Batch export course recordings</button>
      <section id="batchPanel" class="batch-panel" hidden aria-live="polite"></section>

      <button id="retry" class="secondary" type="button" hidden>Scan again</button>
    </main>
    <script src="lib/transcript.js"></script>
    <script src="lib/zip.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
